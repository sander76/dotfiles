[shell_alias]
nvim="~/.local/bin/maybe_nvim.sh"
vi="~/.local/bin/maybe_nvim.sh"
py="ptpython"

[env]
_.python.venv = { path = ".venv", create = true }

[hooks]
enter = "uv pip install pytest-pudb-resurrected ptpython"

[tasks.bootstrap]
description = "bootstrap this worktree"
alias = "bs"
run = [
	'uv sync',
	'pre-commit install',
    'git commit --allow-empty --no-verify -m "$(basename "$PWD")"'
]
