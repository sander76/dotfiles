# Bootstrap configuration for Ubuntu and macOS machines
# Apply with: mise bootstrap --from <this-repo-url>

[tools]
starship = "latest"

[bootstrap.packages]
# Ubuntu (apt) and macOS (brew) - mise picks the right package manager per OS
"apt:git" = "latest"
"apt:zsh" = "latest"
"apt:curl" = "latest"
"apt:unzip" = "latest"
"apt:fontconfig" = "latest"

"brew:git" = "latest"
"brew:zsh" = "latest"
"brew:curl" = "latest"

# Arimo Nerd Font - macOS via brew cask
"brew:font-arimo-nerd-font" = "latest"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
zshenv = "shims"

[bootstrap.user]
login_shell = "zsh"

[dotfiles]
"~/.config/starship.toml" = "dotfiles/starship.toml"
"~/.zshrc" = "dotfiles/zshrc"
"~/.zprofile" = "dotfiles/zprofile"

[tasks.bootstrap]
run = '''
echo "Setting up shell environment..."

# Install Arimo Nerd Font on Ubuntu if not available via package manager
if [[ "$OSTYPE" == "linux-gnu"* ]] && ! fc-list | grep -qi "arimo"; then
  echo "Installing Arimo Nerd Font..."
  FONT_DIR="$HOME/.local/share/fonts"
  mkdir -p "$FONT_DIR"
  curl -sL "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Arimo.zip" -o /tmp/arimo.zip
  unzip -o /tmp/arimo.zip -d "$FONT_DIR" > /dev/null 2>&1
  fc-cache -fv > /dev/null 2>&1
fi

echo "Done! Open a new shell to activate."
'''
